name: integracao continua

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  estagio_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # Ativa o cache das dependências
      - name: Instalar dependências
        run: npm ci # Requer que o package-lock.json esteja commitado no repositório
      - name: Verificar sintaxe básica do projeto
        run: node --check index.js
      - name: Criar configuração temporária do ESLint
        run: |
          cat > eslint.config.js <<'EOF'
          module.exports = [
            {
              files: ["**/*.js"],
              ignores: ["node_modules/**"],
              languageOptions: {
                ecmaVersion: 2021,
                sourceType: "commonjs"
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "error"
              }
            }
          ];
          EOF
      - name: Rodar lint
        run: npm run lint

  estagio_build:
    runs-on: ubuntu-latest
    needs: estagio_lint # Garante que o build só ocorra se o código passar pelo lint
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Instalar dependências
        run: npm ci
      - name: Rodar build
        run: npm run build
